$kind: http-request
url: "{{baseUrl}}/sessions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "teacherId": "{{teacherId}}",
      "startTime": "{{startTime}}",
      "endTime": "{{endTime}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Created", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("sessionId", pm.response.json()._id);
    language: text/javascript
order: 2000
